[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyerowid"
dynamic = ["version"]
description = "Typed Python client for Erowid (erowid.org) + a markdown corpus dumper"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "JarbasAi", email = "jarbasai@mailfence.com" }]
requires-python = ">=3.9"
dependencies = ["requests>=2.28", "beautifulsoup4>=4.11", "unblock_requests"]
keywords = ["erowid", "psychoactives", "harm-reduction", "scraper", "metadata", "corpus"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet :: WWW/HTTP",
]

[project.optional-dependencies]
anon = ["anon_requests"]
stealth = ["curl-cffi"]
test = ["pytest"]

[project.scripts]
pyerowid-dump = "pyerowid.dataset:main"

[project.urls]
Homepage = "https://github.com/LeMetadatarr/pyerowid"
Repository = "https://github.com/LeMetadatarr/pyerowid"

[tool.setuptools.packages.find]
where = ["."]
include = ["pyerowid*"]

[tool.setuptools.dynamic]
version = {attr = "pyerowid.version.__version__"}
